name: Build and Release

on:
    release:
        types: [published]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm install terser

            - name: Get version from tag or package.json
              id: version
              run: |
                  VERSION="${{ github.event.release.tag_name }}"
                  if [[ -z "$VERSION" ]]; then
                    VERSION=${GITHUB_REF#refs/tags/}
                  fi
                  VERSION=${VERSION#v}
                  if [[ -z "$VERSION" ]]; then
                    echo "Could not determine the version from $GITHUB_REF" >&2
                    exit 1
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Version: $VERSION"

            - name: Update manifest.json with version
              run: |
                  VERSION=${{ steps.version.outputs.version }}
                  echo "Updating manifest with version: $VERSION"
                  node -e "
                    const fs = require('fs');
                    const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
                    manifest.version = '$VERSION';
                    fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2));
                    console.log('Updated manifest.json to version $VERSION');
                  "

            - name: Create source archive
              run: |
                  mkdir -p dist
                  cp manifest.json README.md waa.js background.js dist/
                  cp -r icons dist/
                  (cd dist && zip -qr source.zip manifest.json README.md waa.js background.js icons/)
                  echo "Created dist/source.zip"

            - name: Minify js
              run: |
                  npx terser waa.js -o waa.js -c -m
                  npx terser background.js -o background.js -c -m
                  echo "Minified js"

            - name: Create extension artifact
              run: |
                  cp manifest.json waa.js background.js dist/
                  cp -r icons dist/
                  (cd dist && zip -qr whatsapp-web-adapter-${{ steps.version.outputs.version }}.xpi manifest.json waa.js background.js icons/)
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: whatsapp-web-adapter-${{ steps.version.outputs.version }}
                  path: dist/
                  retention-days: 90
            - name: Create release on GitHub
              uses: softprops/action-gh-release@v3
              with:
                  files: "dist/*.xpi"
              # env:
              #     GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

            - name: Publish to addons.mozilla.org
              run: node .github/scripts/publish-amo.mjs
              env:
                  AMO_JWT_KEY: ${{ secrets.AMO_JWT_KEY }}
                  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
                  AMO_XPI: dist/whatsapp-web-adapter-${{ steps.version.outputs.version }}.xpi
                  AMO_SOURCE: dist/source.zip
                  AMO_RELEASE_NOTES: ${{ github.event.release.body }}
